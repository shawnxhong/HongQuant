  - XLF   # Financials
  - XLE   # Energy
  - XLV   # Health Care
  - XLI   # Industrials
  - XLP   # Consumer Staples
  - XLY   # Consumer Discretionary
  - XLU   # Utilities
  - XLRE  # Real Estate
  - XLB   # Materials
  - XLC   # Communication Services

us_broad_etfs:
  - SPY
  - QQQ
  - IWM
  - DIA
  - VTI

us_factor_etfs:
  - MTUM  # Momentum
  - VLUE  # Value
  - QUAL  # Quality
  - USMV  # Min Vol
  - SIZE  # Size

us_commodity_etfs:
  - GLD   # Gold
  - SLV   # Silver
  - USO   # Oil
  - UNG   # Nat Gas
  - DBC   # Broad commodities
  - DBA   # Agriculture

us_stocks_watchlist:
  # Concentrated — these get deep LLM / options-structure coverage.
  - AAPL
  - MSFT
  - NVDA
  - GOOGL
  - AMZN
  - TSLA
  - AVGO
  - AMD
  - INTC
  - MRVL
  - MU
  - SPCX
  - NOK

fred_series:
  - DGS2          # 2Y Treasury
  - DGS10         # 10Y Treasury
  - T10Y2Y        # 10Y-2Y spread
  - DFF           # Fed Funds effective
  - CPIAUCSL      # Headline CPI
  - UNRATE        # Unemployment
  - VIXCLS        # VIX close
  - DCOILWTICO    # WTI crude

# Options risk agent — underliers to scan for OpEx pressure
options_underliers:
  core_etfs: [SPY, QQQ, SMH, SOXX]
  index:     [SPX, NDX]       # requires Polygon paid plan for index options
  vol:       [VIX]            # fetched via FRED series VIXCLS; included for reference

# Momentum stocks to track for breadth / fragility signals
momentum_watchlist:
  - NVDA
  - AVGO
  - AMD
  - MSFT
  - AMZN
  - GOOGL
  - TSLA
  - PLTR
  - ARM
  - ANET
  - CRWD
  - MSTR

# Trend flash-crash radar — themed clusters.
# Clusters drive the intra-theme correlation-cascade signal (Pillar C). Keep
# each cluster a coherent co-moving theme so a spike in within-cluster
# correlation is meaningful.
fragility_clusters:
  gold_complex: [GLD, SLV, GDX]
  ai_semis:     [NVDA, AVGO, AMD, SMH, SOXX, ARM, MU, TSM]
  megacap_tech: [AAPL, MSFT, GOOGL, AMZN, META, NFLX, TSLA]
  korea:        [EWY]
